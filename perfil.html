<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha · StockApp</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .perfil{display:grid;grid-template-columns:340px 1fr;gap:1.5rem}
  @media(max-width:820px){.perfil{grid-template-columns:1fr}}
  .ficha-img{
    background:linear-gradient(135deg, rgba(245,196,0,.1), rgba(58,123,247,.1));
    border:1px solid var(--border);border-radius:18px;
    height:300px;display:flex;align-items:center;justify-content:center;
    font-size:9rem;
  }
  .info-block{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
  .info-item{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem}
  .info-label{font-size:.7rem;color:var(--gray);text-transform:uppercase;letter-spacing:1px;margin-bottom:.3rem}
  .info-value{font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem}

  .selector{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1rem;margin-bottom:1.5rem;
    display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;
  }
  .selector label{font-size:.8rem;color:var(--gray);font-weight:600}
  .selector select{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--white);padding:8px 12px;border-radius:8px;font-family:'DM Sans',sans-serif;outline:none;min-width:200px}
  .selector select option{background:var(--navy-mid)}

  .acciones{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.4rem;margin-top:1.5rem;
  }
  .acc-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;margin-bottom:1rem}
  .acc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem}
  @media(max-width:600px){.acc-grid{grid-template-columns:1fr}}
  .qty-row{display:flex;gap:.5rem;align-items:center;margin-bottom:.7rem}
  .qty-row input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--white);padding:8px 12px;border-radius:8px;outline:none;font-family:'DM Sans',sans-serif}

  .pill-status{display:inline-block;padding:5px 14px;border-radius:20px;font-size:.78rem;font-weight:600;margin-top:.5rem}

  .titulo-prod{font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;line-height:1.1;margin-bottom:.3rem}
  .codigo-prod{font-size:.85rem;color:var(--yellow);font-weight:600;letter-spacing:1px}
  .desc{color:var(--gray-light);line-height:1.6;margin:1rem 0 1.5rem}
</style>
</head>
<body>
<nav class="topnav">
  <div class="brand">Stock<span>App</span></div>
  <div class="tabs">
    <a href="inventario.html">Inventario</a>
    <a href="catalogo.html">Catálogo</a>
    <a href="perfil.html" class="active">Ficha</a>
    <a href="historial.html">Historial</a>
  </div>
</nav>

<main class="wrap">
  <h1 class="page-title">Ficha de detalle</h1>
  <p class="page-sub">Información completa y operaciones rápidas sobre el producto seleccionado.</p>

  <div class="selector">
    <label>Producto:</label>
    <select id="selProd"></select>
  </div>

  <div id="contenido"></div>
</main>

<script src="shared.js"></script>
<script>
function poblarSelect(){
  const sel = document.getElementById('selProd');
  const productos = DB.productos();
  const actual = +DB.seleccionado() || (productos[0]?.id);
  sel.innerHTML = productos.map(p=>`<option value="${p.id}" ${p.id===actual?'selected':''}>${p.codigo} — ${p.nombre}</option>`).join('');
  sel.addEventListener('change', ()=>{ DB.setSeleccionado(+sel.value); render(); });
  if (actual) DB.setSeleccionado(actual);
}

function render(){
  const productos = DB.productos();
  const id = +DB.seleccionado();
  const p = productos.find(x=>x.id===id);
  const cont = document.getElementById('contenido');
  if (!p){
    cont.innerHTML = `<div class="empty"><div class="emoji">📭</div><h3>Sin producto seleccionado</h3><p>Cargá productos desde Inventario.</p></div>`;
    return;
  }
  const e = estadoStock(p);
  const valorTotal = p.stock * p.precio;
  cont.innerHTML = `
    <div class="perfil">
      <div class="ficha-img">${p.img||'📦'}</div>
      <div>
        <div class="codigo-prod">${p.codigo}</div>
        <h2 class="titulo-prod">${p.nombre}</h2>
        <span class="pill-status" style="background:${e.color}22;color:${e.color}">● ${e.label}</span>
        <p class="desc">${p.descripcion || 'Sin descripción cargada.'}</p>
        <div class="info-block">
          <div class="info-item"><div class="info-label">Categoría</div><div class="info-value">${p.categoria}</div></div>
          <div class="info-item"><div class="info-label">Precio unitario</div><div class="info-value">${fmt$(p.precio)}</div></div>
          <div class="info-item"><div class="info-label">Stock actual</div><div class="info-value">${p.stock} u.</div></div>
          <div class="info-item"><div class="info-label">Stock mínimo</div><div class="info-value">${p.minimo} u.</div></div>
          <div class="info-item"><div class="info-label">Valor en stock</div><div class="info-value" style="color:var(--yellow)">${fmt$(valorTotal)}</div></div>
          <div class="info-item"><div class="info-label">Estado</div><div class="info-value" style="color:${e.color}">${e.label}</div></div>
        </div>
      </div>
    </div>

    <div class="acciones">
      <div class="acc-title">Operaciones de stock</div>
      <div class="acc-grid">
        <div>
          <div class="qty-row"><input type="number" min="1" value="1" id="qIn"></div>
          <button class="btn btn-primary" style="width:100%" id="btnIn">+ Ingreso</button>
        </div>
        <div>
          <div class="qty-row"><input type="number" min="1" value="1" id="qOut"></div>
          <button class="btn btn-ghost" style="width:100%" id="btnOut">− Egreso</button>
        </div>
        <div>
          <div class="qty-row"><a href="historial.html" class="btn btn-ghost" style="width:100%;justify-content:center">Ver historial</a></div>
          <button class="btn btn-danger" style="width:100%" id="btnDel">Eliminar producto</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('btnIn').onclick = ()=>{
    const c = +document.getElementById('qIn').value;
    if (c<=0) return toast('Cantidad inválida','error');
    p.stock += c;
    actualizar(p, 'ingreso', c, 'Ingreso manual');
  };
  document.getElementById('btnOut').onclick = ()=>{
    const c = +document.getElementById('qOut').value;
    if (c<=0) return toast('Cantidad inválida','error');
    if (c>p.stock) return toast('No hay suficiente stock','error');
    p.stock -= c;
    actualizar(p, 'egreso', c, 'Egreso manual');
  };
  document.getElementById('btnDel').onclick = ()=>{
    if (!confirm('¿Eliminar definitivamente "'+p.nombre+'"?')) return;
    DB.guardarProductos(productos.filter(x=>x.id!==p.id));
    localStorage.removeItem(DB.KEY_SEL);
    toast('Producto eliminado');
    poblarSelect(); render();
  };
}

function actualizar(p, tipo, cantidad, motivo){
  const productos = DB.productos();
  const i = productos.findIndex(x=>x.id===p.id);
  productos[i] = p;
  DB.guardarProductos(productos);
  DB.agregarMovimiento({ productoId: p.id, tipo, cantidad, motivo });
  toast(tipo==='ingreso'?'Ingreso registrado':'Egreso registrado');
  render();
}

poblarSelect();
render();
</script>
</body>
</html>
