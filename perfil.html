<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoveFix — Perfil de Operador</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1628; --navy-mid: #132040; --navy-light: #1E3460;
    --yellow: #F5C400; --white: #F8F9FC; --gray: #8494A8;
    --card-bg: #15264A; --border: rgba(255,255,255,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background-color: var(--navy); color: var(--white); }
  nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; height: 64px; background: rgba(11,22,40,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
  .nav-logo { display: flex; align-items: center; gap: 10px; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; }
  .nav-tabs { display: flex; gap: 5px; }
  .nav-tab { padding: 0 1rem; height: 64px; display: flex; align-items: center; font-size: 0.85rem; font-weight: 500; color: var(--gray); text-decoration: none; border-bottom: 2px solid transparent; }
  .nav-tab:hover, .nav-tab.active { color: var(--yellow); border-bottom-color: var(--yellow); }
  .page-wrap { max-width: 600px; margin: 3rem auto; padding: 0 1.5rem; }
  .profile-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 2.5rem; text-align: center; }
  .avatar { width: 90px; height: 90px; background: var(--navy-light); border: 3px solid var(--yellow); border-radius: 50%; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800; color: var(--yellow); font-family: 'Syne', sans-serif; }
  .prof-title { font-family: 'Syne', sans-serif; font-size: 1.6rem; font-weight: 800; margin-bottom: .2rem; }
  .prof-subtitle { font-size: 0.88rem; color: var(--gray); margin-bottom: 2rem; }
  .meta-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: left; font-size: 0.95rem; }
  .meta-label { color: var(--gray); font-size: 0.85rem; text-transform: uppercase; font-weight: 600; }
  .meta-value { color: var(--white); font-weight: 500; }
</style>
</head>
<body>
<nav>
  <div class="nav-logo">Move<span>Fix</span></div>
  <div class="nav-tabs">
    <a href="dashboard.html" class="nav-tab">Dashboard</a>
    <a href="inventario.html" class="nav-tab">Inventario</a>
    <a href="perfil.html" class="nav-tab active">Perfil</a>
    <a href="configuracion.html" class="nav-tab">Configuración</a>
    <a href="calendario.html" class="nav-tab">Calendario</a>
    <a href="reservas.html" class="nav-tab">Reservas</a>
    <a href="historial.html" class="nav-tab">Historial</a>
    <a href="catalogo.html" class="nav-tab">Catálogo</a>
  </div>
</nav>
<div class="page-wrap">
  <div class="profile-card">
    <div class="avatar">FG</div>
    <h2 class="prof-title">Facundo González</h2>
    <p class="prof-subtitle">Supervisor General de Terminal Urbana</p>
    <div class="meta-row"><span class="meta-label">Establecimiento</span><span class="meta-value">E.E.S.T N°3 Roberto Arlt</span></div>
    <div class="meta-row"><span class="meta-label">Curso Asignado</span><span class="meta-value">7°1 — Grupo 2</span></div>
    <div class="meta-row"><span class="meta-label">Rango de Acceso</span><span class="meta-value">Administrador Principal</span></div>
    <div class="meta-row"><span class="meta-label">Jurisdicción</span><span class="meta-value">Líneas Urbanas Locales</span></div>
  </div>
</div>
</body>
</html>
