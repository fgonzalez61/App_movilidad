<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoveFix — Control de Stock</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1628; --navy-mid: #132040; --navy-light: #1E3460;
    --yellow: #F5C400; --white: #F8F9FC; --gray: #8494A8;
    --card-bg: #15264A; --border: rgba(255,255,255,0.07); --green: #1EC97E; --red: #E84040;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background-color: var(--navy); color: var(--white); }
  nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; height: 64px; background: rgba(11,22,40,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
  .nav-logo { display: flex; align-items: center; gap: 10px; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; }
  .nav-logo span { color: var(--yellow); }
  .nav-tabs { display: flex; gap: 5px; }
  .nav-tab { padding: 0 1rem; height: 64px; display: flex; align-items: center; font-size: 0.85rem; font-weight: 500; color: var(--gray); text-decoration: none; border-bottom: 2px solid transparent; }
  .nav-tab:hover, .nav-tab.active { color: var(--yellow); border-bottom-color: var(--yellow); }
  .page-wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem 4rem; display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
  @media(max-width:768px){ .page-wrap{grid-template-columns:1fr;} }
  .form-card, .table-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 1.5rem; }
  .form-title { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800; margin-bottom: 1rem; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1rem; }
  .field label { font-size: 0.75rem; font-weight: 600; color: var(--gray); text-transform: uppercase; }
  .field input { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--white); outline: none; }
  .field input:focus { border-color: var(--yellow); }
  .submit-btn { width: 100%; padding: 12px; background: var(--yellow); color: var(--navy); font-family: 'Syne', sans-serif; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: all .2s; }
  .submit-btn:hover { transform: translateY(-1px); }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
  th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--gray); font-size: 0.8rem; text-transform: uppercase; }
  .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
  .badge-ok { background: rgba(30,201,126,0.15); color: var(--green); }
  .badge-low { background: rgba(232,64,64,0.15); color: var(--red); }
  .del-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 0.85rem; }
</style>
</head>
<body>
<nav>
  <div class="nav-logo">Move<span>Fix</span></div>
  <div class="nav-tabs">
    <a href="dashboard.html" class="nav-tab">Dashboard</a>
    <a href="inventario.html" class="nav-tab active">Inventario</a>
    <a href="perfil.html" class="nav-tab">Perfil</a>
    <a href="configuracion.html" class="nav-tab">Configuración</a>
    <a href="calendario.html" class="nav-tab">Calendario</a>
    <a href="reservas.html" class="nav-tab">Reservas</a>
    <a href="historial.html" class="nav-tab">Historial</a>
    <a href="catalogo.html" class="nav-tab">Catálogo</a>
  </div>
</nav>
<div class="page-wrap">
  <div class="form-card">
    <h3 class="form-title">Añadir Insumo</h3>
    <div class="field"><label>Elemento / Componente</label><input type="text" id="itemName" placeholder="Ej: Neumáticos Traseros"></div>
    <div class="field"><label>Cantidad Inicial</label><input type="number" id="itemQty" placeholder="Ej: 24"></div>
    <button class="submit-btn" onclick="addItem()">Ingresar Stock</button>
  </div>
  <div class="table-card">
    <h3 class="form-title">Existencias en Inventario</h3>
    <table>
      <thead><tr><th>Componente</th><th>Cantidad</th><th>Estado</th><th>Acción</th></tr></thead>
      <tbody id="inventoryBody"></tbody>
    </table>
  </div>
</div>
<script>
  let stock = JSON.parse(localStorage.getItem('mf_inventario') || '[]');
  if(!stock.length) {
    stock = [{id:'1', name:'Validadoras SUBE', qty:14}, {id:'2', name:'Paragolpes Frontales', qty:3}];
    localStorage.setItem('mf_inventario', JSON.stringify(stock));
  }
  function renderStock() {
    const tbody = document.getElementById('inventoryBody');
    tbody.innerHTML = stock.map(i => `
      <tr>
        <td><b>${i.name}</b></td>
        <td>${i.qty} unidades</td>
        <td><span class="badge ${i.qty > 5 ? 'badge-ok':'badge-low'}">${i.qty > 5 ? 'Disponible':'Stock Mínimo'}</span></td>
        <td><button class="del-btn" onclick="deleteItem('${i.id}')">🗑</button></td>
      </tr>
    `).join('');
  }
  function addItem() {
    const name = document.getElementById('itemName').value.trim();
    const qty = parseInt(document.getElementById('itemQty').value);
    if(!name || isNaN(qty)) return;
    stock.push({ id: Date.now().toString(), name, qty });
    localStorage.setItem('mf_inventario', JSON.stringify(stock));
    document.getElementById('itemName').value = ''; document.getElementById('itemQty').value = '';
    renderStock();
    logMovement(`Ingreso de stock: ${name} (${qty} u)`);
  }
  function deleteItem(id) {
    stock = stock.filter(i => i.id !== id);
    localStorage.setItem('mf_inventario', JSON.stringify(stock));
    renderStock();
  }
  function logMovement(action) {
    let hist = JSON.parse(localStorage.getItem('mf_historial') || '[]');
    hist.unshift({ id: Date.now(), action, user: 'Facundo González', time: new Date().toLocaleString('es-AR') });
    localStorage.setItem('mf_historial', JSON.stringify(hist));
  }
  window.onload = renderStock;
</script>
</body>
</html>
