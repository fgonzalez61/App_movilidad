<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoveFix — Historial de Movimientos</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B1628; --navy-mid: #132040; --navy-light: #1E3460;
    --yellow: #F5C400; --white: #F8F9FC; --gray: #8494A8;
    --card-bg: #15264A; --border: rgba(255,255,255,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background-color: var(--navy); color: var(--white); }
  nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 2.5rem; height: 64px; background: rgba(11,22,40,0.85); border-bottom: 1px solid var(--border); }
  .nav-logo { display: flex; align-items: center; gap: 10px; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem; }
  .nav-tabs { display: flex; gap: 5px; }
  .nav-tab { padding: 0 1rem; height: 64px; display: flex; align-items: center; font-size: 0.85rem; font-weight: 500; color: var(--gray); text-decoration: none; border-bottom: 2px solid transparent; }
  .nav-tab:hover, .nav-tab.active { color: var(--yellow); border-bottom-color: var(--yellow); }
  .page-wrap { max-width: 900px; margin: 3rem auto; padding: 0 1.5rem; }
  .history-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 2rem; }
  .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .title { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; }
  .timeline { display: flex; flex-direction: column; gap: 12px; }
  .log-item { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 0.9rem; align-items: center; }
  .log-action { font-weight: 500; color: var(--white); }
  .log-meta { font-size: 0.78rem; color: var(--gray); text-align: right; }
  .clear-btn { background: none; border: none; color: var(--gray); cursor: pointer; font-size: .85rem; text-decoration: underline; }
</style>
</head>
<body>
<nav>
  <div class="nav-logo">Move<span>Fix</span></div>
  <div class="nav-tabs">
    <a href="dashboard.html" class="nav-tab">Dashboard</a>
    <a href="inventario.html" class="nav-tab">Inventario</a>
    <a href="perfil.html" class="nav-tab">Perfil</a>
    <a href="configuracion.html" class="nav-tab">Configuración</a>
    <a href="calendario.html" class="nav-tab">Calendario</a>
    <a href="reservas.html" class="nav-tab">Reservas</a>
    <a href="historial.html" class="nav-tab active">Historial</a>
    <a href="catalogo.html" class="nav-tab">Catálogo</a>
  </div>
</nav>
<div class="page-wrap">
  <div class="history-card">
    <div class="title-row">
      <h2 class="title">Registro Log de Movimientos</h2>
      <button class="clear-btn" onclick="clearLogs()">Limpiar log</button>
    </div>
    <div class="timeline" id="logContainer"></div>
  </div>
</div>
<script>
  function renderLogs() {
    let hist = JSON.parse(localStorage.getItem('mf_historial') || '[]');
    const container = document.getElementById('logContainer');
    if(!hist.length) {
      container.innerHTML = `<p style="color:var(--gray);font-size:.9rem;text-align:center;padding:2rem 0;">No se registraron movimientos en esta sesión.</p>`;
      return;
    }
    container.innerHTML = hist.map(l => `
      <div class="log-item">
        <span class="log-action">⚡ ${l.action}</span>
        <div class="log-meta"><div>Por: <b>${l.user}</b></div><div>${l.time}</div></div>
      </div>
    `).join('');
  }
  function clearLogs() {
    localStorage.removeItem('mf_historial');
    renderLogs();
  }
  window.onload = renderLogs;
</script>
</body>
</html>
